version: '2.2.0'
gui_gateway_bind: '0.0.0.0'
gui_gateway_port: 8765
ground_test_log_root: '~/rcboat_balloon_data/logs/ground_tests'
arduino_port: '/dev/serial/by-id/usb-Arduino__www.arduino.cc__Arduino_Uno_55639303534351D01210-if00'
gps_port: '/dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00'
arduino_baudrate: 9600
gps_baudrate: 115200
gps_stale_s: 2.0
# Diagnostic warning reference only. It does not lock navigation.
max_hdop: 3.0
steering_low: 4900
steering_center: 6000
steering_high: 7300
throttle_stop: 6450
throttle_forward_max: 7000
throttle_reverse_max: 5800
cruise_pwm: 6650
nav_invert_steering: true
pca_bus: 1
pca_address: 64
pca_frequency: 60
steering_channel: 0
throttle_channel: 6
command_timeout_s: 0.75
remote_heartbeat_s: 0.7
log_rate_hz: 4.0
endpoint_tolerance_m: 0.75
# Routes are never generated automatically. Multi-Path considers only routes
# explicitly saved by the operator; a ground test freezes the selected N-route group or one route.
# At every GPS update, select the member subroute with the smallest polyline
# distance. There is no distance threshold, hold timer, priority gate or cooldown.
tracking_mode: 'HEADING'
lookahead_base_m: 2.0
lookahead_speed_gain_s: 2.5
lookahead_min_m: 2.0
lookahead_max_m: 10.0
speed_feedback_enabled: false
target_speed_mps: 0.6
# GNSS course-over-ground quality is diagnostic only (not physical heading)
course_min_speed_mps: 0.35
vision:
  camera_type: usb
  camera_source: /dev/video0
  csi_sensor_id: 0
  width: 640
  height: 480
  camera_fps: 15
  model_path: ~/rcboat_balloon_data/models/balloon_yolov5n.onnx
  model_manifest: ~/rcboat_balloon_data/models/model_manifest.json
  input_size: 320
  confidence: 0.45
  inference_hz: 5.0
  max_frame_age_s: 1.0
  acquire_frames: 3
  cruise_pwm: 6550
  max_throttle_pwm: 6650
  steering_right_sign: -1
  stop_area_ratio: 0.18
  preview_port: 8766

name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  vision-numeric:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.26.4 opencv-python-headless==4.8.1.78
      - run: python -m unittest discover -s tests -p 'test_long_range_vision.py' -v
      - run: python -m unittest discover -s tests -p 'test_cuda_runtime_v243.py' -v
  python-regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run formal release tests
        shell: bash
        run: PYTHONPATH=catkin_ws/src/rcboat_ros/src python -m unittest discover -s tests -v
      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q catkin_ws windows_gui

name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Parse deployment PowerShell
        shell: powershell
        run: |
          $source = Get-Content deployment\windows\Deploy_Jetson_v1.6.0.ps1 -Raw
          [void][scriptblock]::Create($source)
          Write-Host "DEPLOY_POWERSHELL_PARSE_OK"

      - name: Build RCBoatControl.exe
        shell: cmd
        run: windows_gui_source\build.bat

      - name: Create v1.6.0 Windows package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item windows_gui_source\windows_app\dist\RCBoatControl.exe release\RCBoatControl_v1.6.0.exe
          Copy-Item deployment\windows\Deploy_Jetson_v1.6.0.ps1 release\Deploy_Jetson_v1.6.0.ps1
          Copy-Item deployment\windows\01_DEPLOY_JETSON_v1.6.0.cmd release\01_DEPLOY_JETSON_v1.6.0.cmd
          Copy-Item deployment\windows\README.md release\README_DEPLOY.md
          Copy-Item VERSION release\VERSION
          Copy-Item CHANGELOG.md release\CHANGELOG.md
          Compress-Archive -Path release\* -DestinationPath RCBoat_v1.6.0_Windows.zip -Force
          Get-FileHash release\RCBoatControl_v1.6.0.exe -Algorithm SHA256 | Format-List
          Get-FileHash RCBoat_v1.6.0_Windows.zip -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: RCBoat_v1.6.0_Windows
          path: |
            RCBoat_v1.6.0_Windows.zip
            release/RCBoatControl_v1.6.0.exe
          if-no-files-found: error
          retention-days: 30

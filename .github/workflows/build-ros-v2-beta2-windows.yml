name: RC Boat ROS v2.0.0-beta.2 Windows EXE
on:
  push:
    branches:
      - beta/ros-v2.0.0-beta.2
    paths:
      - 'beta/ros_v2.0.0_beta2/**'
      - '.github/workflows/build-ros-v2-beta2-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deployment-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Linux shell syntax, text line endings and executable restoration
        shell: bash
        run: |
          set -euo pipefail
          base=beta/ros_v2.0.0_beta2
          for script in "$base"/deployment/jetson/*.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s "$base/tests" -p 'test_linux_deployment.py' -v
  linux-catkin-noetic-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build catkin package with real ROS Noetic environment (Docker)
        shell: bash
        run: |
          set -euo pipefail
          workspace="$GITHUB_WORKSPACE/beta/ros_v2.0.0_beta2/catkin_ws"
          docker run --rm \
            -v "$workspace:/workspace" \
            -w /workspace \
            ros:noetic-ros-base-focal \
            bash -lc 'set -eo pipefail; source /opt/ros/noetic/setup.bash; catkin_make -DCATKIN_ENABLE_TESTING=OFF'
          test -f "$workspace/devel/setup.bash"
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Run the ACTUAL CHECK_WINDOWS.cmd - no pause
        shell: pwsh
        run: |
          $env:RCBOAT_NO_PAUSE='1'
          Push-Location 'beta/ros_v2.0.0_beta2'
          try {
            $output=& cmd.exe /d /c CHECK_WINDOWS.cmd 2>&1 | Out-String
            $rc=$LASTEXITCODE
            Write-Host $output
            if ($rc -ne 0) { throw "CHECK_WINDOWS.cmd failed with code $rc" }
            if ($output -notmatch 'Windows preflight completed') { throw 'Expected preflight OK marker absent' }
            if ($output -match '제공된 패턴|鍮뚮뱶|鍮\S+|No file matches') { throw 'CHECK_WINDOWS printed localized missing-file or mojibake text' }
          } finally {Pop-Location}
      - name: Test CHECK_WINDOWS.cmd in Unicode+spaces folder
        shell: pwsh
        run: |
          $env:RCBOAT_NO_PAUSE='1'
          $probe=Join-Path $env:RUNNER_TEMP 'RCBoat 한글 (test path)'
          New-Item -ItemType Directory -Force -Path (Join-Path $probe 'tools/windows') | Out-Null
          Copy-Item 'beta/ros_v2.0.0_beta2/CHECK_WINDOWS.cmd' $probe
          Copy-Item 'beta/ros_v2.0.0_beta2/tools/windows/runner.ps1' (Join-Path $probe 'tools/windows')
          Push-Location $probe
          try {
            $output=& cmd.exe /d /c CHECK_WINDOWS.cmd 2>&1 | Out-String
            $rc=$LASTEXITCODE
            Write-Host $output
            if ($rc -ne 0) { throw "Unicode-path CHECK_WINDOWS.cmd failed with code $rc" }
            if ($output -notmatch 'Windows preflight completed') { throw 'Unicode-path OK marker missing' }
          } finally {Pop-Location}
      - name: Install Windows requirements
        working-directory: beta/ros_v2.0.0_beta2/windows_gui
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Python unit/regression tests
        run: python -m unittest discover -s beta/ros_v2.0.0_beta2/tests -v
      - name: GUI headless smoke
        shell: pwsh
        working-directory: beta/ros_v2.0.0_beta2/windows_gui
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python app.py --smoke-test --screenshot smoke/dashboard.png
          if ($LASTEXITCODE -ne 0) { throw 'PySide6 smoke failed' }
      - name: Windows PyInstaller build
        working-directory: beta/ros_v2.0.0_beta2/windows_gui
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --add-data 'assets;assets' --icon assets/cat_boat_icon.ico --name RCBoatControl_ROS_v2.0.0-beta.2 app.py
      - name: Test bundled EXE and write SHA256
        shell: pwsh
        run: |
          $exe='beta/ros_v2.0.0_beta2/windows_gui/dist/RCBoatControl_ROS_v2.0.0-beta.2.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'EXE missing' }
          $env:QT_QPA_PLATFORM='offscreen'
          @'
          import os, pathlib, subprocess
          exe = pathlib.Path('beta/ros_v2.0.0_beta2/windows_gui/dist/RCBoatControl_ROS_v2.0.0-beta.2.exe').resolve()
          env = dict(os.environ)
          env['QT_QPA_PLATFORM'] = 'offscreen'
          result = subprocess.run([str(exe), '--smoke-test'], env=env, timeout=120, check=False)
          if result.returncode != 0:
              raise RuntimeError(f'Bundled EXE smoke failed with exit code {result.returncode}')
          print('Bundled EXE smoke test passed')
          '@ | python -
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          "$hash *RCBoatControl_ROS_v2.0.0-beta.2.exe" | Out-File -FilePath (Join-Path (Split-Path $exe) 'SHA256SUMS.txt') -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: RCBoatControl_ROS_v2.0.0-beta.2_Windows_x64
          if-no-files-found: error
          retention-days: 30
          path: |
            beta/ros_v2.0.0_beta2/windows_gui/dist/RCBoatControl_ROS_v2.0.0-beta.2.exe
            beta/ros_v2.0.0_beta2/windows_gui/dist/SHA256SUMS.txt
            beta/ros_v2.0.0_beta2/windows_gui/smoke/dashboard.png

  windows-python313-local-builder:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build with Python 3.13 from deep user Downloads-like folder
        shell: pwsh
        run: |
          $env:RCBOAT_NO_PAUSE='1'
          $env:RCBOAT_PYTHON=(Get-Command python.exe).Source
          $source=(Resolve-Path 'beta/ros_v2.0.0_beta2').Path
          $deep=Join-Path $env:RUNNER_TEMP 'RCBoat_ROS_v2.0.0-beta.2_WindowsFix_Source'
          $deep=Join-Path $deep 'RCBoat_ROS_v2.0.0-beta.2_Source'
          $deep=Join-Path $deep 'user_nested_folder_this_name_is_intentionally_long_for_real_MAX_PATH_regression'
          New-Item -ItemType Directory -Force -Path $deep | Out-Null
          Get-ChildItem -LiteralPath $source -Force | ForEach-Object {Copy-Item -LiteralPath $_.FullName -Destination $deep -Recurse -Force}
          if ($deep.Length -lt 145) {throw "Not a meaningful long-path test: $deep"}
          Push-Location $deep
          try {
            & cmd.exe /d /c CHECK_WINDOWS.cmd
            if ($LASTEXITCODE -ne 0) {throw 'Long-path CHECK_WINDOWS.cmd failed'}
            $env:QT_QPA_PLATFORM='offscreen'
            & cmd.exe /d /c BUILD_ROS_GUI.cmd
            if ($LASTEXITCODE -ne 0) {throw 'Long-path BUILD_ROS_GUI.cmd failed'}
            $exe=Join-Path $deep 'windows_gui/dist/RCBoatControl_ROS_v2.0.0-beta.2.exe'
            if (!(Test-Path -LiteralPath $exe)) {throw 'Long-path built EXE missing'}
            Write-Host "Python 3.13 nested-folder build OK: $exe"
          } finally {Pop-Location}

  source-archive:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package complete beta2 source
        shell: pwsh
        run: |
          $archive='RCBoat_ROS_v2.0.0-beta.2_GUIFix_Source.zip'
          Compress-Archive -Path 'beta/ros_v2.0.0_beta2/*' -DestinationPath $archive -CompressionLevel Optimal -Force
          if (!(Test-Path $archive)) {throw 'Source ZIP missing'}
      - uses: actions/upload-artifact@v4
        with:
          name: RCBoat_ROS_v2.0.0-beta.2_GUIFix_Source
          retention-days: 30
          path: RCBoat_ROS_v2.0.0-beta.2_GUIFix_Source.zip

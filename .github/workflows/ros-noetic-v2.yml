name: ROS Noetic balloon v2.2.0 regression

on:
  push:
    branches: [main, codex/balloon-v2.2.0]
  pull_request:

jobs:
  python-regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install detector test dependencies
        run: python -m pip install numpy==1.26.4 opencv-python-headless==4.10.0.84
      - name: Run formal release tests
        shell: bash
        run: PYTHONPATH=catkin_ws/src/rcboat_ros/src python -m unittest discover -s tests -v
      - name: Compile Python sources
        shell: bash
        run: python -m compileall -q catkin_ws windows_gui

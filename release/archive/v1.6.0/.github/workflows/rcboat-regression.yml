name: RC Boat Regression

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: jetson_patch:windows_gui_source/windows_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r windows_gui_source/windows_app/requirements.txt
          python -m pip install -r jetson_patch/requirements-week6.txt
      - name: Compile Python sources
        run: |
          python -m compileall -q jetson_patch/rcboat windows_gui_source/windows_app/rcboat_gui
      - name: Run regression tests
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
